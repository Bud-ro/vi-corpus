[project]
name = "arc-backend"
version = "0.1.0"
description = "Arc FastAPI control plane"
requires-python = ">=3.11"
dependencies = [
  "clerk-backend-api>=5.0.0",
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "nptdms>=1.9.0",
  "numpy>=2.0.0",
  "openai-agents>=0.14.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "resend>=2.30.1",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
