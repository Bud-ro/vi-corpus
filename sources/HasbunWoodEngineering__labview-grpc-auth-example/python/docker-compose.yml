services:
  web:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn auth_service.asgi:application --host 0.0.0.0 --port 8000

  grpc:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
    ports:
      - "127.0.0.1:50051:50051"
    command: >
      sh -c "python -m grpc_tools.protoc -I grpc_auth --python_out=grpc_auth --grpc_python_out=grpc_auth grpc_auth/auth.proto
      && python manage.py rungrpc --port 50051"
