{% load i18n %}
{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block head_title %}Auth{% endblock %}</title>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("{% static 'fonts/JetBrainsMono-Regular.woff2' %}") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("{% static 'fonts/JetBrainsMono-Medium.woff2' %}") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("{% static 'fonts/JetBrainsMono-SemiBold.woff2' %}") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("{% static 'fonts/JetBrainsMono-Bold.woff2' %}") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --blue: #032ca6;
        --white: #ffffff;
        --black: #000000;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--black);
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        background: var(--white);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      .shell {
        width: min(520px, 100%);
        background: var(--white);
        border-radius: 12px;
        border: 2px solid var(--blue);
        padding: 2.5rem;
        position: relative;
        overflow: hidden;
      }
      .title {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 2rem;
        margin: 0 0 0.5rem 0;
      }
      .subtitle {
        color: var(--black);
        margin: 0 0 2rem 0;
      }
      form .field {
        margin-bottom: 1.25rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      input,
      textarea {
        width: 100%;
        padding: 0.75rem 0.9rem;
        border-radius: 8px;
        border: 2px solid var(--black);
        font-size: 1rem;
        font-family: inherit;
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--blue);
      }
      .errors {
        background: var(--white);
        border: 2px solid var(--blue);
        color: var(--black);
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
      }
      .messages {
        background: var(--white);
        border: 2px solid var(--blue);
        color: var(--black);
        padding: 0.75rem;
        border-radius: 8px;
        margin-bottom: 1rem;
      }
      .helptext, .secondary {
        color: var(--black);
        font-size: 0.95rem;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-top: 1rem;
      }
      button {
        border: 0;
        background: var(--blue);
        color: var(--white);
        font-weight: 600;
        padding: 0.75rem 1.4rem;
        border-radius: 999px;
        cursor: pointer;
        font-size: 1rem;
      }
      button:hover {
        filter: brightness(0.96);
      }
      a.btn {
        display: inline-block;
        background: var(--blue);
        color: var(--white);
        font-weight: 600;
        padding: 0.75rem 1.4rem;
        border-radius: 999px;
        text-decoration: none;
      }
      a.btn:hover { filter: brightness(0.96); }
      .ghost {
        background: transparent;
        color: var(--black);
        border: 2px solid var(--black);
      }
      a.btn.ghost {
        background: transparent;
        color: var(--black);
        border: 2px solid var(--black);
      }
      .card {
        border: 2px solid var(--blue);
        border-radius: 12px;
        padding: 1.25rem;
        margin-bottom: 1.25rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      a:hover { text-decoration: underline; }
      .footer {
        margin-top: 1.5rem;
        color: var(--black);
        font-size: 0.9rem;
      }
      @media (max-width: 540px) {
        .shell { padding: 2rem; }
        .actions { flex-direction: column; align-items: stretch; }
        button { width: 100%; }
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <main class="shell">
      {% if messages %}
        <div class="messages">
          {% for message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
