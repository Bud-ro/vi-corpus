[Conv_2]
Type = "Conv2D"
Filters = 32
Size = 5
Stride = 2
Pad_Size = 0
BN = TRUE
Activation = "LReLU"
Pad_Type = "Valid"

[FC]
Type = "FC"
Size = 200
BN = TRUE
Activation = "LReLU"

[FC_3]
Type = "FC"
Size = 10
BN = TRUE
