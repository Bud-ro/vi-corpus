[MNIST_CNN_GPU]
Type = "Net"
batch = 128
Beta_1 = 0.9000
Beta_2 = 0.9990
k = 4.0000
Weight_Decay(L1) = 1.0000E-7
Weight_Decay(L2) = 1.0000E-7
LR0 = 2.0000E-2
